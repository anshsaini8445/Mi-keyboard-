name: Build Ultra MI Keyboard APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate MI-Keyboard Source Tree
        run: |
          mkdir -p app/src/main/java/com/mi/keyboard
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable

          # 1. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MI-Keyboard"
          include(":app")
          EOF

          # 3. build.gradle.kts (Root)
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.mi.keyboard"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.mi.keyboard"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 4
                  versionName = "2.0.0-ULTRA"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <application
                  android:allowBackup="true"
                  android:label="MI Keyboard"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.InputMethod">
                  <service
                      android:name=".MIKeyboardService"
                      android:label="MI Keyboard"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:theme="@android:style/Theme.DeviceDefault.InputMethod"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF

          # 6. res/xml/method.xml
          cat << 'EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android">
              <subtype
                  android:label="English (US)"
                  android:imeSubtypeLocale="en_US"
                  android:imeSubtypeMode="keyboard" />
          </input-method>
          EOF

          # 7. res/values files
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">MI Keyboard</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="kb_bg">#121214</color>
              <color name="kb_bar_bg">#1D1D20</color>
              <color name="kb_key_bg">#2C2C2E</color>
              <color name="kb_key_special">#3A3A3D</color>
              <color name="kb_white">#FFFFFF</color>
              <color name="kb_gold">#FFD700</color>
              <color name="kb_cyan">#00E5FF</color>
              <color name="kb_red">#FF5252</color>
              <color name="kb_green">#69F0AE</color>
          </resources>
          EOF

          # 8. Drawables
          cat << 'EOF' > app/src/main/res/drawable/key_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#2C2C2E" />
              <corners android:radius="7dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/key_special_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
