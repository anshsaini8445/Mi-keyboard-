          # 11. MIKeyboardService.kt (Complete Logic)
          cat << 'EOF' > app/src/main/java/com/mi/keyboard/MIKeyboardService.kt
          package com.mi.keyboard

          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.inputmethodservice.InputMethodService
          import android.os.Build
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.speech.RecognizerIntent
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.View
          import android.widget.Button
          import android.widget.GridLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.core.content.ContextCompat
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel

          class MIKeyboardService : InputMethodService() {

              private val job = SupervisorJob()
              private val serviceScope = CoroutineScope(Dispatchers.Main + job)
              private lateinit var textEngine: TextEngine
              private lateinit var clipManager: ClipboardManager
              private var vibrator: Vibrator? = null

              private var isCaps = false
              private var isSymbols = false
              private var isSecondSymbols = false
              private var hapticEnabled = true

              private lateinit var panelMain: LinearLayout
              private lateinit var panelTiles: LinearLayout
              private lateinit var panelClip: LinearLayout
              private lateinit var panelEdit: LinearLayout
              private lateinit var panelEmoji: LinearLayout

              private lateinit var clipItemsContainer: LinearLayout
              private lateinit var emojiGridView: GridLayout
              private lateinit var emojiTabsContainer: LinearLayout

              private val clipboardHistory = mutableListOf<String>()

              // Comprehensive Unicode Emoji Categories
              private val emojiCategories = linkedMapOf(
                  "😀" to (0x1F600..0x1F64F),  // Smileys & Faces
                  "👋" to (0x1F440..0x1F480),  // Hands & Gestures
                  "🐶" to (0x1F400..0x1F43E),  // Animals
                  "🍔" to (0x1F344..0x1F37F),  // Food & Drinks
                  "⚽" to (0x1F3A0..0x1F3E0),  // Sports & Games
                  "🚀" to (0x1F680..0x1F6C5),  // Travel & Vehicles
                  "💡" to (0x1F4A0..0x1F4FF),  // Objects & Tools
                  "❤️" to (0x1F9E0..0x1F9FF)   // Hearts & Symbols
              )

              override fun onCreate() {
                  super.onCreate()
                  textEngine = TextEngine(serviceScope)
                  clipManager = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  vibrator = getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator

                  clipManager.addPrimaryClipChangedListener {
                      val clip = clipManager.primaryClip
                      if (clip != null && clip.itemCount > 0) {
                          val copied = clip.getItemAt(0).coerceToText(this).toString()
                          if (copied.isNotBlank() && !clipboardHistory.contains(copied)) {
                              clipboardHistory.add(0, copied)
                              if (clipboardHistory.size > 50) clipboardHistory.removeLast()
                          }
                      }
                  }
              }

              private fun performHaptic() {
                  if (!hapticEnabled) return
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          vibrator?.vibrate(VibrationEffect.createOneShot(18, VibrationEffect.DEFAULT_AMPLITUDE))
                      } else {
                          @Suppress("DEPRECATION")
                          vibrator?.vibrate(18)
                      }
                  } catch (_: Exception) {}
              }

              override fun onCreateInputView(): View {
                  val root = layoutInflater.inflate(R.layout.keyboard_layout, null)

                  panelMain = root.findViewById(R.id.panel_main_keyboard)
                  panelTiles = root.findViewById(R.id.panel_tiles_menu)
                  panelClip = root.findViewById(R.id.panel_clipboard)
                  panelEdit = root.findViewById(R.id.panel_text_edit)
                  panelEmoji = root.findViewById(R.id.panel_emoji)

                  clipItemsContainer = root.findViewById(R.id.clipboard_items_container)
                  emojiGridView = root.findViewById(R.id.emoji_grid_view)
                  emojiTabsContainer = root.findViewById(R.id.emoji_tabs_container)

                  setupTopIconToolbar(root)
                  setupTilesMenu(root)
                  setupTextEditPad(root)
                  setupClipboardUI(root)
                  setupEmojiSuite(root)
                  renderMainKeyboard()

                  return root
              }

              private fun showPanel(target: View) {
                  performHaptic()
                  panelMain.visibility = View.GONE
                  panelTiles.visibility = View.GONE
                  panelClip.visibility = View.GONE
                  panelEdit.visibility = View.GONE
                  panelEmoji.visibility = View.GONE
                  target.visibility = View.VISIBLE
              }

              private fun setupTopIconToolbar(root: View) {
                  // Direct Icon Triggers
                  root.findViewById<Button>(R.id.tb_icon_emoji).setOnClickListener { showPanel(panelEmoji) }
                  root.findViewById<Button>(R.id.tb_icon_clip).setOnClickListener {
                      refreshClipboardHistoryList()
                      showPanel(panelClip)
                  }
                  root.findViewById<Button>(R.id.tb_icon_edit).setOnClickListener { showPanel(panelEdit) }
                  root.findViewById<Button>(R.id.tb_icon_turbo).setOnClickListener { paste50KTurbo() }
                  root.findViewById<Button>(R.id.tb_icon_mic).setOnClickListener { triggerVoiceTyping() }

                  // Open Samsung-Style Tile Boxes
                  root.findViewById<Button>(R.id.tb_icon_more_dots).setOnClickListener { showPanel(panelTiles) }
              }

              private fun setupTilesMenu(root: View) {
                  root.findViewById<Button>(R.id.btn_tiles_back).setOnClickListener { showPanel(panelMain) }

                  root.findViewById<LinearLayout>(R.id.box_clipboard).setOnClickListener {
                      refreshClipboardHistoryList()
                      showPanel(panelClip)
                  }

                  root.findViewById<LinearLayout>(R.id.box_text_edit).setOnClickListener {
                      showPanel(panelEdit)
                  }

                  root.findViewById<LinearLayout>(R.id.box_turbo_paste).setOnClickListener {
                      paste50KTurbo()
                      showPanel(panelMain)
                  }

                  root.findViewById<LinearLayout>(R.id.box_select_all).setOnClickListener {
                      performHaptic()
                      currentInputConnection?.performContextMenuAction(android.R.id.selectAll)
                  }

                  root.findViewById<LinearLayout>(R.id.box_clear).setOnClickListener {
                      performHaptic()
                      currentInputConnection?.performContextMenuAction(android.R.id.selectAll)
                      currentInputConnection?.commitText("", 1)
                  }

                  val hapticBox = root.findViewById<LinearLayout>(R.id.box_haptic)
                  val hapticLabel = root.findViewById<TextView>(R.id.tv_haptic_label)
                  hapticBox.setOnClickListener {
                      hapticEnabled = !hapticEnabled
                      hapticLabel.text = if (hapticEnabled) "Haptic: ON" else "Haptic: OFF"
                      performHaptic()
                  }
              }

              private fun paste50KTurbo() {
                  performHaptic()
                  val clip = clipManager.primaryClip
                  if (clip != null && clip.itemCount > 0) {
                      val text = clip.getItemAt(0).coerceToText(this)
                      if (!text.isNullOrEmpty()) {
                          textEngine.streamLargeText(currentInputConnection, text)
                      }
                  }
              }

              private fun triggerVoiceTyping() {
                  performHaptic()
                  try {
                      val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      startActivity(intent)
                  } catch (_: Exception) {}
              }

              private fun setupClipboardUI(root: View) {
                  root.findViewById<Button>(R.id.btn_clip_back).setOnClickListener { showPanel(panelMain) }
                  root.findViewById<Button>(R.id.btn_clip_clear_all).setOnClickListener {
                      performHaptic()
                      clipboardHistory.clear()
                      refreshClipboardHistoryList()
                  }
              }

              private fun refreshClipboardHistoryList() {
                  clipItemsContainer.removeAllViews()
                  if (clipboardHistory.isEmpty()) {
                      val emptyTv = TextView(this).apply {
                          text = "Clipboard is empty. Copy text anywhere to store here."
                          setTextColor(0xFFAAAAAA.toInt())
                          textSize = 13f
                          setPadding(20, 40, 20, 40)
                      }
                      clipItemsContainer.addView(emptyTv)
                      return
                  }

                  for (item in clipboardHistory) {
                      val itemRow = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply { setMargins(0, 0, 0, 8) }
                          background = ContextCompat.getDrawable(this@MIKeyboardService, R.drawable.tile_box_bg)
                          setPadding(12, 10, 12, 10)
                      }

                      val textPreview = TextView(this).apply {
                          text = if (item.length > 80) item.substring(0, 80) + "..." else item
                          setTextColor(0xFFFFFFFF.toInt())
                          textSize = 13f
                          layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                          setOnClickListener {
                              performHaptic()
                              textEngine.streamLargeText(currentInputConnection, item)
                              showPanel(panelMain)
                          }
                      }

                      val deleteBtn = Button(this).apply {
                          text = "✕"
                          setTextColor(0xFFFF5252.toInt())
                          setBackgroundColor(0x00000000)
                          layoutParams = LinearLayout.LayoutParams(70, 80)
                          setOnClickListener {
                              performHaptic()
                              clipboardHistory.remove(item)
                              refreshClipboardHistoryList()
                          }
                      }

                      itemRow.addView(textPreview)
                      itemRow.addView(deleteBtn)
                      clipItemsContainer.addView(itemRow)
                  }
              }

              private fun setupTextEditPad(root: View) {
                  root.findViewById<Button>(R.id.ed_back_to_abc).setOnClickListener { showPanel(panelMain) }
                  root.findViewById<Button>(R.id.ed_select_all).setOnClickListener {
                      performHaptic()
                      currentInputConnection?.performContextMenuAction(android.R.id.selectAll)
                  }
                  root.findViewById<Button>(R.id.ed_cut).setOnClickListener {
                      performHaptic()
                      currentInputConnection?.performContextMenuAction(android.R.id.cut)
                  }
                  root.findViewById<Button>(R.id.ed_copy).setOnClickListener {
                      performHaptic()
                      currentInputConnection?.performContextMenuAction(android.R.id.copy)
                  }
                  root.findViewById<Button>(R.id.ed_paste).setOnClickListener {
                      performHaptic()
                      val clip = clipManager.primaryClip
                      if (clip != null && clip.itemCount > 0) {
                          val txt = clip.getItemAt(0).coerceToText(this)
                          textEngine.streamLargeText(currentInputConnection, txt)
                      }
                  }

                  root.findViewById<Button>(R.id.ed_up).setOnClickListener { sendKey(KeyEvent.KEYCODE_DPAD_UP) }
                  root.findViewById<Button>(R.id.ed_down).setOnClickListener { sendKey(KeyEvent.KEYCODE_DPAD_DOWN) }
                  root.findViewById<Button>(R.id.ed_left).setOnClickListener { sendKey(KeyEvent.KEYCODE_DPAD_LEFT) }
                  root.findViewById<Button>(R.id.ed_right).setOnClickListener { sendKey(KeyEvent.KEYCODE_DPAD_RIGHT) }
              }

              private fun sendKey(code: Int) {
                  performHaptic()
                  currentInputConnection?.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, code))
                  currentInputConnection?.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, code))
              }

              private fun setupEmojiSuite(root: View) {
                  root.findViewById<Button>(R.id.btn_emoji_to_abc).setOnClickListener { showPanel(panelMain) }
                  root.findViewById<Button>(R.id.btn_emoji_space).setOnClickListener {
                      performHaptic()
                      currentInputConnection?.commitText(" ", 1)
                  }
                  root.findViewById<Button>(R.id.btn_emoji_del).setOnClickListener {
                      performHaptic()
                      currentInputConnection?.deleteSurroundingText(1, 0)
                  }

                  emojiTabsContainer.removeAllViews()
                  for ((icon, range) in emojiCategories) {
                      val tabBtn = Button(this).apply {
                          text = icon
                          textSize = 18f
                          setBackgroundColor(0x00000000)
                          layoutParams = LinearLayout.LayoutParams(95, 80)
                          setOnClickListener {
                              performHaptic()
                              loadEmojiRange(range)
                          }
                      }
                      emojiTabsContainer.addView(tabBtn)
                  }

                  loadEmojiRange(emojiCategories.values.first())
              }

              private fun loadEmojiRange(range: IntRange) {
                  emojiGridView.removeAllViews()
                  for (cp in range) {
                      try {
                          val chars = Character.toChars(cp)
                          val emojiStr = String(chars)
                          val tv = TextView(this).apply {
                              text = emojiStr
                              textSize = 24f
                              gravity = android.view.Gravity.CENTER
                              setPadding(8, 8, 8, 8)
                              setOnClickListener {
                                  performHaptic()
                                  currentInputConnection?.commitText(emojiStr, 1)
                              }
                          }
                          emojiGridView.addView(tv)
                      } catch (_: Exception) {}
                  }
              }

              private fun renderMainKeyboard() {
                  panelMain.removeAllViews()

                  val rows = when {
                      !isSymbols -> listOf(
                          listOf("1","2","3","4","5","6","7","8","9","0"),
                          listOf("q","w","e","r","t","y","u","i","o","p"),
                          listOf("a","s","d","f","g","h","j","k","l"),
                          listOf("CAPS","z","x","c","v","b","n","m","DEL"),
                          listOf("?123","😀","SPACE","ENTER")
                      )
                      !isSecondSymbols -> listOf(
                          listOf("1","2","3","4","5","6","7","8","9","0"),
                          listOf("@","#","$","%","&","*","-","+","=","/"),
                          listOf("1/2","(","/",":",";","!","?","\"",")","DEL"),
                          listOf("ABC","😀","SPACE","ENTER")
                      )
                      else -> listOf(
                          listOf("~","`","|","•","√","π","÷","×","§","Δ"),
                          listOf("£","¥","€","¢","^","°","=","{","}","\\"),
                          listOf("2/2","%","[","]","<",">","«","»","¡","DEL"),
                          listOf("ABC","😀","SPACE","ENTER")
                      )
                  }

                  for (row in rows) {
                      val rowView = LinearLayout(this).apply {
                          layoutParams = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          )
                          orientation = LinearLayout.HORIZONTAL
                      }

                      for (k in row) {
                          val btn = Button(this).apply {
                              var label = k
                              if (!isSymbols && isCaps && k.length == 1 && !k.matches(Regex("[0-9]"))) {
                                  label = k.uppercase()
                              }
                              text = label
                              setTextColor(0xFFFFFFFF.toInt())
                              textSize = if (k.length > 2) 12f else 15f

                              val isSpecial = k in listOf("DEL", "CAPS", "ENTER", "?123", "ABC", "1/2", "2/2", "😀")
                              background = ContextCompat.getDrawable(
                                  this@MIKeyboardService,
                                  if (isSpecial) R.drawable.key_special_bg else R.drawable.key_bg
                              )

                              val weight = when (k) {
                                  "SPACE" -> 4.2f
                                  "ENTER", "?123", "ABC" -> 1.8f
                                  "CAPS", "DEL", "1/2", "2/2" -> 1.4f
                                  "😀" -> 1.2f
                                  else -> 1.0f
                              }

                              layoutParams = LinearLayout.LayoutParams(0, 126, weight).apply {
                                  setMargins(2, 2, 2, 2)
                              }

                              if (k == "SPACE") {
                                  var startTouchX = 0f
                                  setOnTouchListener { _, event ->
                                      when (event.action) {
                                          MotionEvent.ACTION_DOWN -> {
                                              startTouchX = event.x
                                              false
                                          }
                                          MotionEvent.ACTION_MOVE -> {
                                              val diff = event.x - startTouchX
                                              if (Math.abs(diff) > 28f) {
                                                  if (diff > 0) {
                                                      sendKey(KeyEvent.KEYCODE_DPAD_RIGHT)
                                                  } else {
                                                      sendKey(KeyEvent.KEYCODE_DPAD_LEFT)
                                                  }
                                                  startTouchX = event.x
                                              }
                                              true
                                          }
                                          else -> false
                                      }
                                  }
                              }

                              setOnClickListener {
                                  performHaptic()
                                  handleMainKeys(k)
                              }
                          }
                          rowView.addView(btn)
                      }
                      panelMain.addView(rowView)
                  }
              }

              private fun handleMainKeys(key: String) {
                  val ic = currentInputConnection ?: return
                  when (key) {
                      "DEL" -> ic.deleteSurroundingText(1, 0)
                      "CAPS" -> {
                          isCaps = !isCaps
                          renderMainKeyboard()
                      }
                      "SPACE" -> ic.commitText(" ", 1)
                      "ENTER" -> sendKey(KeyEvent.KEYCODE_ENTER)
                      "?123" -> {
                          isSymbols = true
                          isSecondSymbols = false
                          renderMainKeyboard()
                      }
                      "1/2" -> {
                          isSecondSymbols = true
                          renderMainKeyboard()
                      }
                      "2/2" -> {
                          isSecondSymbols = false
                          renderMainKeyboard()
                      }
                      "ABC" -> {
                          isSymbols = false
                          isSecondSymbols = false
                          renderMainKeyboard()
                      }
                      "😀" -> showPanel(panelEmoji)
                      else -> {
                          val char = if (isCaps && !isSymbols) key.uppercase() else key
                          ic.commitText(char, 1)
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  serviceScope.cancel()
              }
          }
