                      <Button
                          android:id="@+id/btn_emoji_space"
                          android:layout_width="0dp"
                          android:layout_height="38dp"
                          android:layout_marginHorizontal="4dp"
                          android:layout_weight="3.4"
                          android:background="@drawable/key_bg"
                          android:text="SPACE"
                          android:textColor="@color/kb_white" />

                      <Button
                          android:id="@+id/btn_emoji_del"
                          android:layout_width="0dp"
                          android:layout_height="38dp"
                          android:layout_weight="1.4"
                          android:background="@drawable/key_special_bg"
                          android:text="DEL"
                          android:textColor="@color/kb_white" />
                  </LinearLayout>
              </LinearLayout>

          </LinearLayout>
          EOF

          # 10. TextEngine.kt (Chunk Safe Streamer)
          cat << 'EOF' > app/src/main/java/com/mi/keyboard/TextEngine.kt
          package com.mi.keyboard

          import android.view.inputmethod.InputConnection
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          class TextEngine(private val scope: CoroutineScope) {
              private val CHUNK_SIZE = 4096

              fun streamLargeText(ic: InputConnection?, text: CharSequence) {
                  if (ic == null || text.isEmpty()) return

                  scope.launch(Dispatchers.Default) {
                      val total = text.length
                      var start = 0

                      withContext(Dispatchers.Main) {
                          ic.beginBatchEdit()
                      }

                      while (start < total) {
                          val end = (start + CHUNK_SIZE).coerceAtMost(total)
                          val chunk = text.subSequence(start, end).toString()

                          withContext(Dispatchers.Main) {
                              ic.commitText(chunk, 1)
                          }
                          start = end
                      }

                      withContext(Dispatchers.Main) {
                          ic.endBatchEdit()
                      }
                  }
              }
          }
