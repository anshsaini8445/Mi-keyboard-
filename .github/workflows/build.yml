                      <Button
                          android:id="@+id/btn_copy"
                          android:layout_width="wrap_content"
                          android:layout_height="34dp"
                          android:layout_marginEnd="4dp"
                          android:background="@drawable/toolbar_btn_bg"
                          android:text="COPY"
                          android:textColor="@color/kb_accent_green"
                          android:textStyle="bold" />

                      <Button
                          android:id="@+id/btn_ultra_paste"
                          android:layout_width="wrap_content"
                          android:layout_height="34dp"
                          android:layout_marginEnd="4dp"
                          android:background="@drawable/toolbar_btn_bg"
                          android:text="⚡ 50K TURBO PASTE"
                          android:textColor="@color/kb_accent_gold"
                          android:textStyle="bold" />

                      <Button
                          android:id="@+id/btn_left"
                          android:layout_width="40dp"
                          android:layout_height="34dp"
                          android:layout_marginEnd="3dp"
                          android:background="@drawable/toolbar_btn_bg"
                          android:text="◀"
                          android:textColor="@color/kb_white" />

                      <Button
                          android:id="@+id/btn_right"
