              </LinearLayout>
          </LinearLayout>
          EOF

          # 10. TextEngine.kt (50,000 Lines Chunk Buffer Streamer)
          cat << 'EOF' > app/src/main/java/com/mi/keyboard/TextEngine.kt
          package com.mi.keyboard

          import android.view.inputmethod.InputConnection
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          class TextEngine(private val scope: CoroutineScope) {
              private val CHUNK_SIZE = 4096

              fun streamLargeText(ic: InputConnection?, text: CharSequence) {
                  if (ic == null || text.isEmpty()) return

                  scope.launch(Dispatchers.Default) {
                      val len = text.length
                      var idx = 0

                      withContext(Dispatchers.Main) {
                          ic.beginBatchEdit()
                      }

                      while (idx < len) {
                          val end = (idx + CHUNK_SIZE).coerceAtMost(len)
                          val chunk = text.subSequence(idx, end).toString()

                          withContext(Dispatchers.Main) {
                              ic.commitText(chunk, 1)
                          }
                          idx = end
                      }

                      withContext(Dispatchers.Main) {
                          ic.endBatchEdit()
                      }
                  }
              }
          }
          EOF

          # 11. MIKeyboardService.kt
          cat << 'EOF' > app/src/main/java/com/mi/keyboard/MIKeyboardService.kt
          package com.mi.keyboard

          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.inputmethodservice.InputMethodService
          import android.view.KeyEvent
          import android.view.View
          import android.widget.Button
          import android.widget.GridLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.core.content.ContextCompat
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel

          class MIKeyboardService : InputMethodService() {

              private val job = SupervisorJob()
              private val serviceScope = CoroutineScope(Dispatchers.Main + job)
              private lateinit var textEngine: TextEngine
              private lateinit var clipManager: ClipboardManager

              private var isCaps = false
              private var isSymbols = false
              private var isEmojiOpen = false

              private var keysLayout: LinearLayout? = null
              private var emojiPanel: LinearLayout? = null
              private var emojiGrid: GridLayout? = null

              // Categorized Emoji Collections
              private val emojiFaces = listOf(
                  "😀","😃","😄","😁","😆","😅","😂","🤣","🥲","🥹","😊","😇","🙂","🙃","😉",
                  "😌","😍","🥰","😘","😗","😙","😚","😋","😛","😝","😜","🤪","🤨","🧐","🤓",
                  "😎","🥸","🤩","🥳","😏","😒","😞","😔","😟","😕","🙁","☹️","😣","😖","😫",
                  "😩","🥺","😢","😭","😮‍💨","😤","😠","😡","🤬","🤯","😳","🥵","🥶","😱","😨",
                  "😰","😥","🤤","😴","🥱","😷","🤒","🤕","🤢","🤮","😵","🤐","🥴","🤫","🤭"
              )

              private val emojiHands = listOf(
                  "👍","👎","👌","✌️","🤞","🫰","🤟","🤘","🤙","👈","👉","👆","🖕","👇","☝️",
                  "🫵","👋","🤚","🖐️","✋","🖖","👏","🙌","🫶","👐","🤲","🤝","🙏","✍️","💅",
                  "💪","🦾","🤳","👄","👁️","👀","👂","👃","🦶","🦵","🧠","🫀","🫁","🫂","🧑‍💻"
              )

              private val emojiHearts = listOf(
                  "❤️","🧡","💛","💚","💙","💜","🖤","🤍","🤎","💔","❤️‍🔥","❤️‍🩹","❣️","💕","💞",
                  "💓","💗","💖","💘","💝","💟","💌","☮️","✝️","☪️","🕉️","☸️","✡️","🔯","🕎",
                  "♈","♉","♊","♋","♌","♍","♎","♏","♐","♑","♒","♓","⛎","⭕","❌","💯"
              )

              private val emojiFood = listOf(
                  "🍏","🍎","🍐","🍊","🍋","🍌","🍉","🍇","🍓","🫐","🍈","🍒","🍑","🥭","🍍",
                  "🥥","🥝","🍅","🥑","🍔","🍟","🍕","🌭","🥪","🌮","🌯","🥗","🍿","🧈","🥞",
                  "🧇","🧀","🥩","🍗","🍖","🍤","🍣","🍱","🥟","🍜","🍝","🍦","🍧","🍨","🍩",
                  "🍪","🎂","🍰","🧁","🥧","🍫","🍬","🍭","☕","🍵","🧃","🥤","🍺","🍻","🥂"
              )

              private val emojiObjects = listOf(
                  "🔥","✨","🎉","🚀","⚡","⭐","🌟","💡","💻","📱","⌚","🔋","🔌","💵","💰",
                  "💳","💎","📦","📬","🛍️","🎁","🎈","🎯","🎮","🕹️","🏆","🥇","👑","⚽","🏀",
                  "🚗","🚕","🏎️","🚓","🚑","✈️","🛳️","🚨","🔔","🔒","🔑","🛠️","⚙️","🔫","🛡️"
              )

              private var activeEmojiList = emojiFaces

              override fun onCreate() {
                  super.onCreate()
                  textEngine = TextEngine(serviceScope)
                  clipManager = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
              }

              override fun onCreateInputView(): View {
                  val root = layoutInflater.inflate(R.layout.keyboard_layout, null)
                  keysLayout = root.findViewById(R.id.keyboard_keys)
                  emojiPanel = root.findViewById(R.id.emoji_panel)
                  emojiGrid = root.findViewById(R.id.emoji_grid)

                  setupToolbarActions(root)
                  setupEmojiCategoryTabs(root)
                  setupEmojiBottomBar(root)

                  renderEmojiGrid(activeEmojiList)
                  refreshKeys()

                  return root
              }

              private fun setupToolbarActions(root: View) {
                  root.findViewById<Button>(R.id.btn_all)?.setOnClickListener {
                      currentInputConnection?.performContextMenuAction(android.R.id.selectAll)
                  }
                  root.findViewById<Button>(R.id.btn_cut)?.setOnClickListener {
                      currentInputConnection?.performContextMenuAction(android.R.id.cut)
                  }
                  root.findViewById<Button>(R.id.btn_copy)?.setOnClickListener {
                      currentInputConnection?.performContextMenuAction(android.R.id.copy)
                  }
                  root.findViewById<Button>(R.id.btn_ultra_paste)?.setOnClickListener {
                      val clip: ClipData? = clipManager.primaryClip
                      if (clip != null && clip.itemCount > 0) {
                          val text = clip.getItemAt(0).coerceToText(this)
                          if (!text.isNullOrEmpty()) {
                              textEngine.streamLargeText(currentInputConnection, text)
                          }
                      }
                  }
                  root.findViewById<Button>(R.id.btn_left)?.setOnClickListener {
                      currentInputConnection?.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_DPAD_LEFT))
                      currentInputConnection?.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_DPAD_LEFT))
                  }
                  root.findViewById<Button>(R.id.btn_right)?.setOnClickListener {
                      currentInputConnection?.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_DPAD_RIGHT))
                      currentInputConnection?.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_DPAD_RIGHT))
                  }
              }

              private fun setupEmojiCategoryTabs(root: View) {
                  root.findViewById<Button>(R.id.cat_faces)?.setOnClickListener {
                      activeEmojiList = emojiFaces
                      renderEmojiGrid(activeEmojiList)
                  }
                  root.findViewById<Button>(R.id.cat_hands)?.setOnClickListener {
                      activeEmojiList = emojiHands
                      renderEmojiGrid(activeEmojiList)
                  }
                  root.findViewById<Button>(R.id.cat_hearts)?.setOnClickListener {
                      activeEmojiList = emojiHearts
                      renderEmojiGrid(activeEmojiList)
                  }
                  root.findViewById<Button>(R.id.cat_food)?.setOnClickListener {
                      activeEmojiList = emojiFood
                      renderEmojiGrid(activeEmojiList)
                  }
                  root.findViewById<Button>(R.id.cat_objects)?.setOnClickListener {
                      activeEmojiList = emojiObjects
                      renderEmojiGrid(activeEmojiList)
                  }
              }

              private fun setupEmojiBottomBar(root: View) {
                  // Direct Return to Typing Screen
                  root.findViewById<Button>(R.id.btn_emoji_back_abc)?.setOnClickListener {
                      isEmojiOpen = false
                      refreshKeys()
                  }
                  root.findViewById<Button>(R.id.btn_emoji_space)?.setOnClickListener {
                      currentInputConnection?.commitText(" ", 1)
                  }
                  root.findViewById<Button>(R.id.btn_emoji_del)?.setOnClickListener {
                      currentInputConnection?.deleteSurroundingText(1, 0)
                  }
              }

              private fun renderEmojiGrid(list: List<String>) {
                  val grid = emojiGrid ?: return
                  grid.removeAllViews()
                  for (emo in list) {
                      val tv = TextView(this).apply {
                          text = emo
                          textSize = 24f
                          gravity = android.view.Gravity.CENTER
                          setPadding(10, 10, 10, 10)
                          setOnClickListener {
                              currentInputConnection?.commitText(emo, 1)
                          }
                      }
                      grid.addView(tv)
                  }
              }

              private fun refreshKeys() {
                  val layout = keysLayout ?: return
                  val panel = emojiPanel ?: return

                  if (isEmojiOpen) {
                      layout.visibility = View.GONE
                      panel.visibility = View.VISIBLE
                      return
                  }

                  layout.visibility = View.VISIBLE
                  panel.visibility = View.GONE
                  layout.removeAllViews()

                  // Samsung HD Layout: Fixed Top Number Row + QWERTY
                  val rows = if (!isSymbols) {
                      listOf(
                          listOf("1","2","3","4","5","6","7","8","9","0"),
                          listOf("q","w","e","r","t","y","u","i","o","p"),
                          listOf("a","s","d","f","g","h","j","k","l"),
                          listOf("CAPS","z","x","c","v","b","n","m","DEL"),
                          listOf("?123","😀","SPACE","ENTER")
                      )
                  } else {
                      listOf(
                          listOf("1","2","3","4","5","6","7","8","9","0"),
                          listOf("@","#","$","%","&","*","-","+","=","/"),
                          listOf("~","`","<",">","[","]","{","}","DEL"),
                          listOf("ABC","😀","SPACE","ENTER")
                      )
                  }

                  for (row in rows) {
                      val rowView = LinearLayout(this).apply {
                          layoutParams = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          )
                          orientation = LinearLayout.HORIZONTAL
                      }

                      for (k in row) {
                          val btn = Button(this).apply {
                              var label = k
                              if (!isSymbols && isCaps && k.length == 1 && !k.matches(Regex("[0-9]"))) {
                                  label = k.uppercase()
                              }
                              text = label
                              setTextColor(0xFFFFFFFF.toInt())
                              textSize = if (k.length > 2) 12f else 15f

                              val isSpecial = k in listOf("DEL", "CAPS", "ENTER", "?123", "ABC", "😀")
                              background = ContextCompat.getDrawable(
                                  this@MIKeyboardService,
                                  if (isSpecial) R.drawable.key_special_bg else R.drawable.key_bg
                              )

                              val weight = when (k) {
                                  "SPACE" -> 4.0f
                                  "ENTER", "?123", "ABC" -> 1.8f
                                  "CAPS", "DEL" -> 1.5f
                                  "😀" -> 1.2f
                                  else -> 1.0f
                              }

                              layoutParams = LinearLayout.LayoutParams(0, 126, weight).apply {
                                  setMargins(2, 2, 2, 2)
                              }

                              setOnClickListener { handleKeyClick(k) }
                          }
                          rowView.addView(btn)
                      }
                      layout.addView(rowView)
                  }
              }

              private fun handleKeyClick(key: String) {
                  val ic = currentInputConnection ?: return
                  when (key) {
                      "DEL" -> ic.deleteSurroundingText(1, 0)
                      "CAPS" -> {
                          isCaps = !isCaps
                          refreshKeys()
                      }
                      "SPACE" -> ic.commitText(" ", 1)
                      "ENTER" -> {
                          ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER))
                          ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ENTER))
                      }
                      "?123" -> {
                          isSymbols = true
                          refreshKeys()
                      }
                      "ABC" -> {
                          isSymbols = false
                          refreshKeys()
                      }
                      "😀" -> {
                          isEmojiOpen = true
                          refreshKeys()
                      }
                      else -> {
                          val charToCommit = if (isCaps && !isSymbols) key.uppercase() else key
                          ic.commitText(charToCommit, 1)
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  serviceScope.cancel()
              }
          }
          EOF

      - name: Compile Debug APK
        run: gradle assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: MI-Keyboard-App
          path: app/build/outputs/apk/debug/app-debug.apk
