name: Build MI Keyboard OneUI Edition

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate Complete Architecture
        run: |
          mkdir -p app/src/main/java/com/mi/keyboard
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable

          # 1. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MI-Keyboard"
          include(":app")
          EOF

          # 3. build.gradle.kts (Root)
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.mi.keyboard"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.mi.keyboard"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 6
                  versionName = "4.0.0-ONEUI"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <application
                  android:allowBackup="true"
                  android:label="MI Keyboard"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.InputMethod">
                  <service
                      android:name=".MIKeyboardService"
                      android:label="MI Keyboard"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:theme="@android:style/Theme.DeviceDefault.InputMethod"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF

          # 6. res/xml/method.xml
          cat << 'EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android">
              <subtype
                  android:label="English (US)"
                  android:imeSubtypeLocale="en_US"
                  android:imeSubtypeMode="keyboard" />
          </input-method>
          EOF

          # 7. res/values files
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">MI Keyboard</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="kb_bg">#111113</color>
              <color name="kb_bar_bg">#18181B</color>
              <color name="kb_key_normal">#262629</color>
              <color name="kb_key_special">#35353B</color>
              <color name="kb_tile_bg">#232328</color>
              <color name="kb_white">#FFFFFF</color>
              <color name="kb_gold">#FFD700</color>
              <color name="kb_cyan">#00E5FF</color>
              <color name="kb_red">#FF5252</color>
              <color name="kb_green">#69F0AE</color>
          </resources>
          EOF

          # 8. Drawables (One UI Style Tiles & Keys)
          cat << 'EOF' > app/src/main/res/drawable/key_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#26262A" />
              <corners android:radius="8dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/key_special_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#35353B" />
              <corners android:radius="8dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/tile_box_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#222227" />
              <corners android:radius="14dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/icon_btn_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#00000000" />
          </shape>
          EOF

          # 9. Master UI Layout
          cat << 'EOF' > app/src/main/res/layout/keyboard_layout.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:background="@color/kb_bg"
              android:orientation="vertical"
              android:padding="2dp">

              <!-- Samsung One UI Exact Top Icon Toolbar -->
              <LinearLayout
                  android:id="@+id/top_icon_toolbar"
                  android:layout_width="match_parent"
                  android:layout_height="44dp"
                  android:background="@color/kb_bar_bg"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingHorizontal="4dp">

                  <Button
                      android:id="@+id/tb_icon_emoji"
                      android:layout_width="0dp"
                      android:layout_height="38dp"
                      android:layout_weight="1"
                      android:background="@drawable/icon_btn_bg"
                      android:text="🙂"
                      android:textSize="18sp" />

                  <Button
                      android:id="@+id/tb_icon_clip"
                      android:layout_width="0dp"
                      android:layout_height="38dp"
                      android:layout_weight="1"
                      android:background="@drawable/icon_btn_bg"
                      android:text="📋"
                      android:textSize="18sp" />

                  <Button
                      android:id="@+id/tb_icon_edit"
                      android:layout_width="0dp"
                      android:layout_height="38dp"
                      android:layout_weight="1"
                      android:background="@drawable/icon_btn_bg"
                      android:text="✍️"
                      android:textSize="17sp" />

                  <Button
                      android:id="@+id/tb_icon_turbo"
                      android:layout_width="0dp"
                      android:layout_height="38dp"
                      android:layout_weight="1"
                      android:background="@drawable/icon_btn_bg"
                      android:text="⚡"
                      android:textColor="@color/kb_gold"
                      android:textSize="19sp" />

                  <Button
                      android:id="@+id/tb_icon_mic"
                      android:layout_width="0dp"
                      android:layout_height="38dp"
                      android:layout_weight="1"
                      android:background="@drawable/icon_btn_bg"
                      android:text="🎤"
                      android:textSize="17sp" />

                  <Button
                      android:id="@+id/tb_icon_more_dots"
                      android:layout_width="0dp"
                      android:layout_height="38dp"
                      android:layout_weight="1"
                      android:background="@drawable/icon_btn_bg"
                      android:text="•••"
                      android:textColor="@color/kb_white"
                      android:textStyle="bold"
                      android:textSize="16sp" />
              </LinearLayout>

              <!-- View 1: Main QWERTY Layout -->
              <LinearLayout
                  android:id="@+id/panel_main_keyboard"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:layout_marginTop="2dp" />

              <!-- View 2: Samsung Keyboard Function Tiles / Boxes Menu -->
              <LinearLayout
                  android:id="@+id/panel_tiles_menu"
                  android:layout_width="match_parent"
                  android:layout_height="255dp"
                  android:background="#151518"
                  android:orientation="vertical"
                  android:padding="8dp"
                  android:visibility="gone">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:gravity="center_vertical"
                      android:orientation="horizontal"
                      android:layout_marginBottom="8dp">

                      <TextView
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
