          # 9. TextEngine.kt (Chunk Safe Streamer)
          cat << 'EOF' > app/src/main/java/com/mi/keyboard/TextEngine.kt
          package com.mi.keyboard

          import android.view.inputmethod.InputConnection
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          class TextEngine(private val scope: CoroutineScope) {
              private val CHUNK_SIZE = 4096

              fun streamLargeText(ic: InputConnection?, text: CharSequence) {
                  if (ic == null || text.isEmpty()) return

                  scope.launch(Dispatchers.Default) {
                      val total = text.length
                      var start = 0

                      withContext(Dispatchers.Main) {
                          ic.beginBatchEdit()
                      }

                      while (start < total) {
                          val end = (start + CHUNK_SIZE).coerceAtMost(total)
                          val chunk = text.subSequence(start, end).toString()

                          withContext(Dispatchers.Main) {
                              ic.commitText(chunk, 1)
                          }
                          start = end
                      }

                      withContext(Dispatchers.Main) {
                          ic.endBatchEdit()
                      }
                  }
              }
          }
          EOF

          # 10. MIKeyboardService.kt (Theme Engine, Gliding, Verified Emojis)
          cat << 'EOF' > app/src/main/java/com/mi/keyboard/MIKeyboardService.kt
          package com.mi.keyboard

          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.graphics.drawable.GradientDrawable
          import android.inputmethodservice.InputMethodService
          import android.os.Build
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.speech.RecognizerIntent
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.View
          import android.widget.Button
          import android.widget.GridLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel

          class MIKeyboardService : InputMethodService() {

              private val job = SupervisorJob()
              private val serviceScope = CoroutineScope(Dispatchers.Main + job)
              private lateinit var textEngine: TextEngine
              private lateinit var clipManager: ClipboardManager
              private var vibrator: Vibrator? = null

              private var isCaps = false
              private var isSymbols = false
              private var isSecondSymbols = false
              private var hapticEnabled = true

              enum class KeyboardTheme {
                  DARK_AMOLED,
                  GBOARD_WHITE,
                  ONEUI_GREY
              }

              private var currentTheme = KeyboardTheme.DARK_AMOLED

              private var rootView: LinearLayout? = null
              private lateinit var panelMain: LinearLayout
              private lateinit var panelTiles: LinearLayout
              private lateinit var panelClip: LinearLayout
              private lateinit var panelEdit: LinearLayout
              private lateinit var panelEmoji: LinearLayout

              private lateinit var clipItemsContainer: LinearLayout
              private lateinit var emojiGridView: GridLayout
              private lateinit var emojiTabsContainer: LinearLayout
              private var currentEmojiList: List<String> = emptyList()

              private val clipboardHistory = mutableListOf<String>()

              private val emojiCategories = linkedMapOf(
                  "😀" to listOf(
                      "😀","😃","😄","😁","😆","😅","😂","🤣","🥲","🥹","😊","😇","🙂","🙃","😉","😌",
                      "😍","🥰","😘","😗","😙","😚","😋","😛","😝","😜","🤪","🤨","🧐","🤓","😎","🥸",
                      "🤩","🥳","😏","😒","😞","😔","😟","😕","🙁","☹️","😣","😖","😫","😩","🥺","😢",
                      "😭","😮‍💨","😤","😠","😡","🤬","🤯","😳","🥵","🥶","😱","😨","😰","😥","🤤","😴",
                      "🥱","😷","🤒","🤕","🤢","🤮","😵","🤐","🥴","🤫","🤭","🫢","🫣","🫡","😶","😐"
                  ),
                  "👋" to listOf(
                      "👍","👎","👌","🤌","🤏","✌️","🤞","🫰","🤟","🤘","🤙","👈","👉","👆","🖕","👇",
                      "☝️","🫵","👋","🤚","🖐️","✋","🖖","👏","🙌","🫶","👐","🤲","🤝","🙏","✍️","💅",
