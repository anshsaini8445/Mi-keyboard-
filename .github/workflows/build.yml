                  </LinearLayout>

                  <!-- 3x2 Grid of Rounded Feature Boxes -->
                  <GridLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:columnCount="3"
                      android:rowCount="2">

                      <!-- Box 1: Clipboard -->
                      <LinearLayout
