              override fun onCreate() {
                  super.onCreate()
                  textEngine = TextEngine(serviceScope)
                  clipManager = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  vibrator = getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator

                  clipManager.addPrimaryClipChangedListener {
                      val clip = clipManager.primaryClip
                      if (clip != null && clip.itemCount > 0) {
                          val copied = clip.getItemAt(0).coerceToText(this).toString()
                          if (copied.isNotBlank() && !clipboardHistory.contains(copied)) {
                              clipboardHistory.add(0, copied)
                              if (clipboardHistory.size > 50) clipboardHistory.removeLast()
                          }
                      }
                  }
              }

              private fun performHaptic() {
                  if (!hapticEnabled) return
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          vibrator?.vibrate(VibrationEffect.createOneShot(18, VibrationEffect.DEFAULT_AMPLITUDE))
                      } else {
                          @Suppress("DEPRECATION")
                          vibrator?.vibrate(18)
                      }
                  } catch (_: Exception) {}
              }

              override fun onCreateInputView(): View {
                  val root = layoutInflater.inflate(R.layout.keyboard_layout, null) as LinearLayout
                  rootView = root

                  panelMain = root.findViewById(R.id.panel_main_keyboard)
                  panelTiles = root.findViewById(R.id.panel_tiles_menu)
                  panelClip = root.findViewById(R.id.panel_clipboard)
                  panelEdit = root.findViewById(R.id.panel_text_edit)
                  panelEmoji = root.findViewById(R.id.panel_emoji)

                  clipItemsContainer = root.findViewById(R.id.clipboard_items_container)
                  emojiGridView = root.findViewById(R.id.emoji_grid_view)
                  emojiTabsContainer = root.findViewById(R.id.emoji_tabs_container)

                  setupTopIconToolbar(root)
                  setupTilesMenu(root)
                  setupTextEditPad(root)
                  setupClipboardUI(root)
                  setupEmojiSuite(root)

                  applyTheme()
                  renderMainKeyboard()

                  return root
              }

              private fun applyTheme() {
                  val root = rootView ?: return

                  val (bgColor, barColor, tileColor, keyNormalColor, keySpecialColor, textColor) = when (currentTheme) {
                      KeyboardTheme.DARK_AMOLED -> listOf(0xFF111113.toInt(), 0xFF18181B.toInt(), 0xFF222227.toInt(), 0xFF28282C.toInt(), 0xFF35353B.toInt(), 0xFFFFFFFF.toInt())
                      KeyboardTheme.GBOARD_WHITE -> listOf(0xFFECEFF1.toInt(), 0xFFDFE4E8.toInt(), 0xFFFFFFFF.toInt(), 0xFFFFFFFF.toInt(), 0xFFCFD8DC.toInt(), 0xFF1A1A1A.toInt())
                      KeyboardTheme.ONEUI_GREY -> listOf(0xFF24272C.toInt(), 0xFF2B2F36.toInt(), 0xFF333842.toInt(), 0xFF333842.toInt(), 0xFF404652.toInt(), 0xFFFFFFFF.toInt())
                  }

                  root.setBackgroundColor(bgColor)
                  root.findViewById<LinearLayout>(R.id.top_icon_toolbar).setBackgroundColor(barColor)
                  panelTiles.setBackgroundColor(bgColor)
                  panelClip.setBackgroundColor(bgColor)
                  panelEdit.setBackgroundColor(bgColor)
                  panelEmoji.setBackgroundColor(bgColor)
                  root.findViewById<LinearLayout>(R.id.clip_header_bar).setBackgroundColor(barColor)
                  root.findViewById<View>(R.id.emoji_tabs_scroll).setBackgroundColor(barColor)
                  root.findViewById<LinearLayout>(R.id.emoji_bottom_bar).setBackgroundColor(barColor)

                  // Tile boxes styling
                  val boxIds = listOf(R.id.box_clipboard, R.id.box_text_edit, R.id.box_turbo_paste, R.id.box_theme, R.id.box_clear, R.id.box_haptic)
                  for (id in boxIds) {
                      root.findViewById<LinearLayout>(id)?.background = createShape(tileColor, 28f)
                  }

                  root.findViewById<TextView>(R.id.tv_tiles_title)?.setTextColor(textColor)
                  root.findViewById<TextView>(R.id.tv_box_clip)?.setTextColor(textColor)
                  root.findViewById<TextView>(R.id.tv_box_edit)?.setTextColor(textColor)
                  root.findViewById<TextView>(R.id.tv_box_theme)?.setTextColor(textColor)
                  root.findViewById<TextView>(R.id.tv_clip_title)?.setTextColor(textColor)

                  val btnTilesBack = root.findViewById<Button>(R.id.btn_tiles_back)
                  btnTilesBack.background = createShape(keySpecialColor, 16f)
                  btnTilesBack.setTextColor(textColor)

                  val btnClipBack = root.findViewById<Button>(R.id.btn_clip_back)
                  btnClipBack.background = createShape(keySpecialColor, 16f)
                  btnClipBack.setTextColor(textColor)

                  val btnEmojiBack = root.findViewById<Button>(R.id.btn_emoji_to_abc)
                  btnEmojiBack.background = createShape(keySpecialColor, 16f)
                  btnEmojiBack.setTextColor(textColor)

                  val btnEmojiSpace = root.findViewById<Button>(R.id.btn_emoji_space)
                  btnEmojiSpace.background = createShape(keyNormalColor, 16f)
                  btnEmojiSpace.setTextColor(textColor)

                  val btnEmojiDel = root.findViewById<Button>(R.id.btn_emoji_del)
                  btnEmojiDel.background = createShape(keySpecialColor, 16f)
                  btnEmojiDel.setTextColor(textColor)

                  // Edit Pad Buttons
                  val editBtns = listOf(R.id.ed_up, R.id.ed_down, R.id.ed_left, R.id.ed_right)
                  for (bId in editBtns) {
                      val b = root.findViewById<Button>(bId)
                      b.background = createShape(keyNormalColor, 16f)
                      b.setTextColor(textColor)
                  }

                  val editActions = listOf(R.id.ed_select_all, R.id.ed_cut, R.id.ed_copy, R.id.ed_paste, R.id.ed_back_to_abc)
                  for (bId in editActions) {
                      val b = root.findViewById<Button>(bId)
                      b.background = createShape(keySpecialColor, 16f)
                      if (bId == R.id.ed_back_to_abc) b.setTextColor(textColor)
                  }
              }

              private fun createShape(color: Int, radius: Float): GradientDrawable {
                  return GradientDrawable().apply {
                      shape = GradientDrawable.RECTANGLE
                      cornerRadius = radius
                      setColor(color)
                  }
              }

              private fun showPanel(target: View) {
                  performHaptic()
                  panelMain.visibility = View.GONE
                  panelTiles.visibility = View.GONE
                  panelClip.visibility = View.GONE
                  panelEdit.visibility = View.GONE
                  panelEmoji.visibility = View.GONE
                  target.visibility = View.VISIBLE
              }

              private fun setupTopIconToolbar(root: View) {
                  root.findViewById<Button>(R.id.tb_icon_emoji).setOnClickListener { showPanel(panelEmoji) }
                  root.findViewById<Button>(R.id.tb_icon_clip).setOnClickListener {
                      refreshClipboardHistoryList()
                      showPanel(panelClip)
                  }
                  root.findViewById<Button>(R.id.tb_icon_edit).setOnClickListener { showPanel(panelEdit) }
                  root.findViewById<Button>(R.id.tb_icon_theme).setOnClickListener { cycleTheme() }
                  root.findViewById<Button>(R.id.tb_icon_turbo).setOnClickListener { paste50KTurbo() }
                  root.findViewById<Button>(R.id.tb_icon_mic).setOnClickListener { triggerVoiceTyping() }
                  root.findViewById<Button>(R.id.tb_icon_more_dots).setOnClickListener { showPanel(panelTiles) }
              }

              private fun cycleTheme() {
                  performHaptic()
                  currentTheme = when (currentTheme) {
                      KeyboardTheme.DARK_AMOLED -> KeyboardTheme.GBOARD_WHITE
                      KeyboardTheme.GBOARD_WHITE -> KeyboardTheme.ONEUI_GREY
                      KeyboardTheme.ONEUI_GREY -> KeyboardTheme.DARK_AMOLED
                  }
                  val themeName = when (currentTheme) {
                      KeyboardTheme.DARK_AMOLED -> "Theme: Dark"
                      KeyboardTheme.GBOARD_WHITE -> "Theme: White"
                      KeyboardTheme.ONEUI_GREY -> "Theme: Grey"
                  }
                  rootView?.findViewById<TextView>(R.id.tv_box_theme)?.text = themeName
                  applyTheme()
                  renderMainKeyboard()
                  if (currentEmojiList.isNotEmpty()) loadEmojis(currentEmojiList)
              }

              private fun setupTilesMenu(root: View) {
                  root.findViewById<Button>(R.id.btn_tiles_back).setOnClickListener { showPanel(panelMain) }

                  root.findViewById<LinearLayout>(R.id.box_clipboard).setOnClickListener {
                      refreshClipboardHistoryList()
                      showPanel(panelClip)
                  }

                  root.findViewById<LinearLayout>(R.id.box_text_edit).setOnClickListener { showPanel(panelEdit) }

                  root.findViewById<LinearLayout>(R.id.box_turbo_paste).setOnClickListener {
                      paste50KTurbo()
                      showPanel(panelMain)
                  }

                  root.findViewById<LinearLayout>(R.id.box_theme).setOnClickListener { cycleTheme() }

                  root.findViewById<LinearLayout>(R.id.box_clear).setOnClickListener {
                      performHaptic()
                      currentInputConnection?.performContextMenuAction(android.R.id.selectAll)
                      currentInputConnection?.commitText("", 1)
                  }

                  val hapticBox = root.findViewById<LinearLayout>(R.id.box_haptic)
                  val hapticLabel = root.findViewById<TextView>(R.id.tv_haptic_label)
                  hapticBox.setOnClickListener {
                      hapticEnabled = !hapticEnabled
                      hapticLabel.text = if (hapticEnabled) "Haptic: ON" else "Haptic: OFF"
                      performHaptic()
                  }
              }

              private fun paste50KTurbo() {
                  performHaptic()
                  val clip = clipManager.primaryClip
                  if (clip != null && clip.itemCount > 0) {
                      val text = clip.getItemAt(0).coerceToText(this)
                      if (!text.isNullOrEmpty()) {
                          textEngine.streamLargeText(currentInputConnection, text)
                      }
                  }
              }

              private fun triggerVoiceTyping() {
                  performHaptic()
                  try {
                      val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      startActivity(intent)
                  } catch (_: Exception) {}
              }

              private fun setupClipboardUI(root: View) {
                  root.findViewById<Button>(R.id.btn_clip_back).setOnClickListener { showPanel(panelMain) }
                  root.findViewById<Button>(R.id.btn_clip_clear_all).setOnClickListener {
                      performHaptic()
                      clipboardHistory.clear()
                      refreshClipboardHistoryList()
                  }
              }

              private fun refreshClipboardHistoryList() {
                  clipItemsContainer.removeAllViews()
                  val textColor = if (currentTheme == KeyboardTheme.GBOARD_WHITE) 0xFF1A1A1A.toInt() else 0xFFFFFFFF.toInt()
                  val itemBg = when (currentTheme) {
                      KeyboardTheme.DARK_AMOLED -> 0xFF222227.toInt()
                      KeyboardTheme.GBOARD_WHITE -> 0xFFFFFFFF.toInt()
                      KeyboardTheme.ONEUI_GREY -> 0xFF333842.toInt()
                  }

                  if (clipboardHistory.isEmpty()) {
                      val emptyTv = TextView(this).apply {
                          text = "Clipboard is empty. Copy any text anywhere to store here."
                          setTextColor(0xFFAAAAAA.toInt())
                          textSize = 13f
                          setPadding(20, 40, 20, 40)
                      }
                      clipItemsContainer.addView(emptyTv)
                      return
                  }

                  for (item in clipboardHistory) {
                      val itemRow = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply { setMargins(0, 0, 0, 8) }
                          background = createShape(itemBg, 18f)
                          setPadding(14, 12, 14, 12)
                      }

                      val textPreview = TextView(this).apply {
                          text = if (item.length > 80) item.substring(0, 80) + "..." else item
                          setTextColor(textColor)
                          textSize = 13f
                          layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                          setOnClickListener {
                              performHaptic()
                              textEngine.streamLargeText(currentInputConnection, item)
                              showPanel(panelMain)
                          }
                      }

                      val deleteBtn = Button(this).apply {
                          text = "✕"
                          setTextColor(0xFFFF5252.toInt())
                          setBackgroundColor(0x00000000)
                          layoutParams = LinearLayout.LayoutParams(70, 80)
                          setOnClickListener {
                              performHaptic()
                              clipboardHistory.remove(item)
                              refreshClipboardHistoryList()
                          }
                      }

                      itemRow.addView(textPreview)
                      itemRow.addView(deleteBtn)
                      clipItemsContainer.addView(itemRow)
                  }
              }

              private fun setupTextEditPad(root: View) {
                  root.findViewById<Button>(R.id.ed_back_to_abc).setOnClickListener { showPanel(panelMain) }
                  root.findViewById<Button>(R.id.ed_select_all).setOnClickListener {
                      performHaptic()
                      currentInputConnection?.performContextMenuAction(android.R.id.selectAll)
                  }
                  root.findViewById<Button>(R.id.ed_cut).setOnClickListener {
                      performHaptic()
                      currentInputConnection?.performContextMenuAction(android.R.id.cut)
                  }
                  root.findViewById<Button>(R.id.ed_copy).setOnClickListener {
                      performHaptic()
                      currentInputConnection?.performContextMenuAction(android.R.id.copy)
                  }
                  root.findViewById<Button>(R.id.ed_paste).setOnClickListener {
                      performHaptic()
                      val clip = clipManager.primaryClip
                      if (clip != null && clip.itemCount > 0) {
                          val txt = clip.getItemAt(0).coerceToText(this)
                          textEngine.streamLargeText(currentInputConnection, txt)
                      }
                  }

                  root.findViewById<Button>(R.id.ed_up).setOnClickListener { sendKey(KeyEvent.KEYCODE_DPAD_UP) }
                  root.findViewById<Button>(R.id.ed_down).setOnClickListener { sendKey(KeyEvent.KEYCODE_DPAD_DOWN) }
                  root.findViewById<Button>(R.id.ed_left).setOnClickListener { sendKey(KeyEvent.KEYCODE_DPAD_LEFT) }
                  root.findViewById<Button>(R.id.ed_right).setOnClickListener { sendKey(KeyEvent.KEYCODE_DPAD_RIGHT) }
              }

              private fun sendKey(code: Int) {
                  performHaptic()
                  currentInputConnection?.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, code))
                  currentInputConnection?.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, code))
              }

              private fun setupEmojiSuite(root: View) {
                  root.findViewById<Button>(R.id.btn_emoji_to_abc).setOnClickListener { showPanel(panelMain) }
                  root.findViewById<Button>(R.id.btn_emoji_space).setOnClickListener {
                      performHaptic()
                      currentInputConnection?.commitText(" ", 1)
                  }
                  root.findViewById<Button>(R.id.btn_emoji_del).setOnClickListener {
                      performHaptic()
                      currentInputConnection?.deleteSurroundingText(1, 0)
                  }

                  emojiTabsContainer.removeAllViews()
                  for ((icon, list) in emojiCategories) {
                      val tabBtn = Button(this).apply {
                          text = icon
                          textSize = 18f
                          setBackgroundColor(0x00000000)
                          layoutParams = LinearLayout.LayoutParams(110, 85)
                          setOnClickListener {
                              performHaptic()
                              loadEmojis(list)
                          }
                      }
                      emojiTabsContainer.addView(tabBtn)
                  }

                  loadEmojis(emojiCategories.values.first())
              }

              private fun loadEmojis(list: List<String>) {
                  currentEmojiList = list
                  emojiGridView.removeAllViews()
                  val screenWidth = resources.displayMetrics.widthPixels
                  val emojiSize = screenWidth / 8

                  for (emojiStr in list) {
                      val tv = TextView(this).apply {
                          text = emojiStr
                          textSize = 22f
                          gravity = android.view.Gravity.CENTER
                          layoutParams = GridLayout.LayoutParams().apply {
                              width = emojiSize
                              height = (emojiSize * 1.05).toInt()
                          }
                          setOnClickListener {
                              performHaptic()
                              currentInputConnection?.commitText(emojiStr, 1)
                          }
                      }
                      emojiGridView.addView(tv)
                  }
              }

              private fun renderMainKeyboard() {
                  panelMain.removeAllViews()

                  val (keyNormalColor, keySpecialColor, textColor) = when (currentTheme) {
                      KeyboardTheme.DARK_AMOLED -> listOf(0xFF28282C.toInt(), 0xFF35353B.toInt(), 0xFFFFFFFF.toInt())
                      KeyboardTheme.GBOARD_WHITE -> listOf(0xFFFFFFFF.toInt(), 0xFFCFD8DC.toInt(), 0xFF1A1A1A.toInt())
                      KeyboardTheme.ONEUI_GREY -> listOf(0xFF333842.toInt(), 0xFF404652.toInt(), 0xFFFFFFFF.toInt())
                  }

                  val rows = when {
                      !isSymbols -> listOf(
                          listOf("1","2","3","4","5","6","7","8","9","0"),
                          listOf("q","w","e","r","t","y","u","i","o","p"),
                          listOf("a","s","d","f","g","h","j","k","l"),
                          listOf("CAPS","z","x","c","v","b","n","m","DEL"),
                          listOf("?123","😀","SPACE","ENTER")
                      )
                      !isSecondSymbols -> listOf(
                          listOf("1","2","3","4","5","6","7","8","9","0"),
                          listOf("@","#","$","%","&","*","-","+","=","/"),
                          listOf("1/2","(","/",":",";","!","?","\"",")","DEL"),
                          listOf("ABC","😀","SPACE","ENTER")
                      )
                      else -> listOf(
                          listOf("~","`","|","•","√","π","÷","×","§","Δ"),
                          listOf("£","¥","€","¢","^","°","=","{","}","\\"),
                          listOf("2/2","%","[","]","<",">","«","»","¡","DEL"),
                          listOf("ABC","😀","SPACE","ENTER")
                      )
                  }

                  for (row in rows) {
                      val rowView = LinearLayout(this).apply {
                          layoutParams = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          )
                          orientation = LinearLayout.HORIZONTAL
                      }

                      for (k in row) {
                          val btn = Button(this).apply {
                              var label = k
                              if (!isSymbols && isCaps && k.length == 1 && !k.matches(Regex("[0-9]"))) {
                                  label = k.uppercase()
                              }
                              text = label
                              setTextColor(textColor)
                              textSize = if (k.length > 2) 12f else 15f

                              val isSpecial = k in listOf("DEL", "CAPS", "ENTER", "?123", "ABC", "1/2", "2/2", "😀")
                              background = createShape(if (isSpecial) keySpecialColor else keyNormalColor, 18f)

                              val weight = when (k) {
                                  "SPACE" -> 4.2f
                                  "ENTER", "?123", "ABC" -> 1.8f
                                  "CAPS", "DEL", "1/2", "2/2" -> 1.4f
                                  "😀" -> 1.2f
                                  else -> 1.0f
                              }

                              layoutParams = LinearLayout.LayoutParams(0, 126, weight).apply {
                                  setMargins(2, 2, 2, 2)
                              }

                              // Gboard Spacebar Cursor Gliding
                              if (k == "SPACE") {
                                  var startTouchX = 0f
                                  setOnTouchListener { _, event ->
                                      when (event.action) {
                                          MotionEvent.ACTION_DOWN -> {
                                              startTouchX = event.x
                                              false
                                          }
                                          MotionEvent.ACTION_MOVE -> {
                                              val diff = event.x - startTouchX
                                              if (Math.abs(diff) > 28f) {
                                                  if (diff > 0) {
                                                      sendKey(KeyEvent.KEYCODE_DPAD_RIGHT)
                                                  } else {
                                                      sendKey(KeyEvent.KEYCODE_DPAD_LEFT)
                                                  }
                                                  startTouchX = event.x
                                              }
                                              true
                                          }
                                          else -> false
                                      }
                                  }
                              }

                              setOnClickListener {
                                  performHaptic()
                                  handleMainKeys(k)
                              }
                          }
                          rowView.addView(btn)
                      }
                      panelMain.addView(rowView)
                  }
              }

              private fun handleMainKeys(key: String) {
                  val ic = currentInputConnection ?: return
                  when (key) {
                      "DEL" -> ic.deleteSurroundingText(1, 0)
                      "CAPS" -> {
                          isCaps = !isCaps
                          renderMainKeyboard()
                      }
                      "SPACE" -> ic.commitText(" ", 1)
                      "ENTER" -> sendKey(KeyEvent.KEYCODE_ENTER)
                      "?123" -> {
                          isSymbols = true
                          isSecondSymbols = false
                          renderMainKeyboard()
                      }
                      "1/2" -> {
                          isSecondSymbols = true
                          renderMainKeyboard()
                      }
                      "2/2" -> {
                          isSecondSymbols = false
                          renderMainKeyboard()
                      }
                      "ABC" -> {
                          isSymbols = false
                          isSecondSymbols = false
                          renderMainKeyboard()
                      }
                      "😀" -> showPanel(panelEmoji)
                      else -> {
                          val char = if (isCaps && !isSymbols) key.uppercase() else key
                          ic.commitText(char, 1)
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  serviceScope.cancel()
              }
          }
          EOF

      - name: Compile Debug APK
        run: gradle assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: MI-Keyboard-App
          path: app/build/outputs/apk/debug/app-debug.apk
