              <!-- Full Screen Emoji Panel with Return Button & Category Bar -->
              <LinearLayout
                  android:id="@+id/emoji_panel"
                  android:layout_width="match_parent"
                  android:layout_height="250dp"
                  android:orientation="vertical"
                  android:visibility="gone">

                  <!-- Emoji Category Tabs -->
                  <HorizontalScrollView
                      android:layout_width="match_parent"
                      android:layout_height="36dp"
                      android:background="#1F1F23"
                      android:scrollbars="none">

                      <LinearLayout
                          android:layout_width="wrap_content"
                          android:layout_height="match_parent"
                          android:gravity="center_vertical"
                          android:orientation="horizontal">

                          <Button
                              android:id="@+id/cat_faces"
                              android:layout_width="50dp"
                              android:layout_height="32dp"
                              android:background="@android:color/transparent"
                              android:text="😀"
                              android:textSize="17sp" />

                          <Button
                              android:id="@+id/cat_hands"
                              android:layout_width="50dp"
                              android:layout_height="32dp"
                              android:background="@android:color/transparent"
                              android:text="👍"
                              android:textSize="17sp" />

                          <Button
                              android:id="@+id/cat_hearts"
                              android:layout_width="50dp"
                              android:layout_height="32dp"
                              android:background="@android:color/transparent"
                              android:text="❤️"
                              android:textSize="17sp" />

                          <Button
                              android:id="@+id/cat_food"
                              android:layout_width="50dp"
                              android:layout_height="32dp"
                              android:background="@android:color/transparent"
                              android:text="🍕"
                              android:textSize="17sp" />

                          <Button
                              android:id="@+id/cat_objects"
                              android:layout_width="50dp"
                              android:layout_height="32dp"
                              android:background="@android:color/transparent"
                              android:text="🔥"
                              android:textSize="17sp" />
                      </LinearLayout>
                  </HorizontalScrollView>

                  <!-- Scrollable Emoji Grid -->
                  <ScrollView
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1"
                      android:background="#161618">

                      <GridLayout
                          android:id="@+id/emoji_grid"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:columnCount="7"
                          android:padding="4dp" />
                  </ScrollView>

                  <!-- Bottom Emoji Navigation Bar (ABC Back Button, Space, Del) -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="45dp"
                      android:background="#1B1B1E"
                      android:gravity="center_vertical"
                      android:orientation="horizontal"
                      android:padding="3dp">

                      <Button
                          android:id="@+id/btn_emoji_back_abc"
                          android:layout_width="0dp"
                          android:layout_height="38dp"
                          android:layout_weight="1.8"
                          android:background="@drawable/key_special_bg"
                          android:text="ABC"
                          android:textColor="@color/kb_white"
                          android:textStyle="bold" />

                      <Button
                          android:id="@+id/btn_emoji_space"
                          android:layout_width="0dp"
                          android:layout_height="38dp"
                          android:layout_marginHorizontal="4dp"
                          android:layout_weight="3.2"
                          android:background="@drawable/key_bg"
                          android:text="SPACE"
                          android:textColor="@color/kb_white" />

                      <Button
                          android:id="@+id/btn_emoji_del"
                          android:layout_width="0dp"
                          android:layout_height="38dp"
                          android:layout_weight="1.5"
                          android:background="@drawable/key_special_bg"
                          android:text="DEL"
                          android:textColor="@color/kb_white" />
